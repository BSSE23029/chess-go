name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run repository gates
        run: make verify
      - name: Build reproducible binary
        run: make build VERSION=ci
      - name: Verify deterministic output
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags '-s -w -buildid= -X main.version=ci' -o /tmp/chess-a ./cmd/chess
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags '-s -w -buildid= -X main.version=ci' -o /tmp/chess-b ./cmd/chess
          cmp /tmp/chess-a /tmp/chess-b
