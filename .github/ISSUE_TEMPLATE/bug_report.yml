name: Bug report
description: Report a reproducible rules, engine, terminal, or network problem
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected and observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, terminal dimensions, environment settings, and smallest position or PGN that reproduces it.
      render: console
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: chess-go version, Go version, OS, terminal
    validations:
      required: true
