name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release archives
        run: VERSION="${GITHUB_REF_NAME}" make release-all
      - name: Verify release checksums
        run: VERSION="${GITHUB_REF_NAME}" make release-verify
      - name: Attest release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/releases/${{ github.ref_name }}/*'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/releases/"${GITHUB_REF_NAME}"/* --verify-tag --generate-notes
      - name: Verify release attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/releases/"${GITHUB_REF_NAME}"/*.tar.gz dist/releases/"${GITHUB_REF_NAME}"/*.zip; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
