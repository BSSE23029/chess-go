name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run repository gates
        run: make verify
      - name: Check search-work regression threshold
        run: make benchmark-regression
      - name: Build reproducible binary
        run: make build VERSION=ci
      - name: Verify deterministic output
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags '-s -w -buildid= -X main.version=ci' -o /tmp/chess-a ./cmd/chess
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags '-s -w -buildid= -X main.version=ci' -o /tmp/chess-b ./cmd/chess
          cmp /tmp/chess-a /tmp/chess-b

  tui-platforms:
    name: TUI ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test command and launcher packages
        run: go test ./cmd/chess -count=1
      - name: Build launcher
        run: go build ./cmd/chess
